include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'

variables:
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.26

# Ref matrix:
# - main and release-cmkv2: test_and_lint on code changes, then build_and_push
#   publishes $RELEASE_IMAGE:<branch name>.
# - merge requests: test_and_lint and build_and_push on code changes.
# - any tag: test_and_lint runs; build_and_push is a manual job that publishes
#   $RELEASE_IMAGE:<tag> (the tag name is the image tag, and also the binary's
#   version string). Semver tags are included: tag_semver is disabled here, so
#   a semver tag on GitLab is always a deliberate manual release.
test_and_lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release" || $CI_COMMIT_BRANCH == "release-cmkv2"'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    - if: '$CI_COMMIT_TAG'

build_and_push:
  script:
    - |-
      if [ "${BUILD_IN_SUBPATH:-true}" == "true" ]; then
        cd ${SUBPROJECT_REL_PATH}
      fi
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    # Build an image based on the commit ref, this will be available
    # internally for testing feature branches and testing pre-release versions
    - docker build --no-cache --pull -f "${DOCKERFILE:-./Dockerfile}" --build-arg CI_SERVER_HOST="$CI_SERVER_HOST" --build-arg CI_JOB_TOKEN="$CI_JOB_TOKEN" --build-arg CRUSOE_CLOUD_CONTROLLER_MANAGER_NAME="$CRUSOE_CLOUD_CONTROLLER_MANAGER_NAME" --build-arg CRUSOE_CLOUD_CONTROLLER_MANAGER_VERSION="$CI_COMMIT_REF_NAME" -t $RELEASE_IMAGE:"${CI_COMMIT_REF_NAME##*/}" .
    - docker push $RELEASE_IMAGE:"${CI_COMMIT_REF_NAME##*/}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release-cmkv2"'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    # Manual on tags: run the job from the tag's pipeline to publish
    # $RELEASE_IMAGE:<tag>. A tag with a slash keeps only its last segment.
    - if: '$CI_COMMIT_TAG'
      when: manual

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action instead
# and new versions will be pushed then.
tag_semver:
  rules:
    - when: never

code_intelligence:
  rules:
    - when: never

pages:
  rules:
    - when: never
